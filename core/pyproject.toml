[project]
name = "skifer-atlas"
version = "0.0.1"
description = "Skifer Atlas — définitions canoniques et déclinaisons des KPI, comparaison structurelle et chiffrée."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "sqlglot>=25.0",
    "duckdb>=1.0",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "platformdirs>=4.0",
    "skifer",
    "tzdata>=2024.1 ; sys_platform == 'win32'",
    "keyring>=25.0",
    "snowflake-connector-python>=3.12",
]

[project.scripts]
atlas = "skifer_atlas.cli:main"
skifer-atlas-server = "skifer_atlas.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "jsonschema>=4.23",
    "hypothesis>=6.100",
]
build = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skifer_atlas"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]  # scripts et notebooks d'entrée de l'extraction

[tool.pytest.ini_options]
markers = [
    "github: test réel contre GitHub (ATLAS_GITHUB_TEST_REPO), hors CI",
    "databricks: test réel contre un SQL warehouse Databricks (ATLAS_DATABRICKS_*), hors CI",
    "snowflake: test réel contre un compte Snowflake (ATLAS_SNOWFLAKE_*), hors CI",
    "sidecar: binaire figé construit par scripts/build-sidecar.sh, hors CI",
]

[tool.uv.sources]
skifer = { git = "https://github.com/morzu117/skifer.git", rev = "v4.0.0" }

schema_version: 1
kind: kpi
data_product:
  id: revenu-net
  version: 4
  owner: claire.m
  domain: finance
  description: Chiffre d'affaires facturé, taxes déduites, net des avoirs, sur le calendrier fiscal de l'entité.
label: Revenu net
synonyms: [CA net, net revenue]
semantics:
  calendar: {key: fiscal-nordis, version: '2026.1'}
  timezone: Europe/Paris
  currency: EUR
variation_points: [n03, n04]
graph:
  nodes:
    - id: n01
      type: source
      label: Factures
      platform: databricks
      table: gold.finance.fact_facturation
      owner: claire.m
      columns:
        - {name: facture_id, type: string}
        - {name: commande_id, type: string}
        - {name: entite, type: string}
        - {name: statut, type: string}
        - {name: date_facture, type: date, timezone: Europe/Paris, format: yyyy-MM-dd}
        - {name: montant_ttc, type: decimal}
        - {name: montant_taxes, type: decimal}
        - {name: avoirs, type: decimal}
      concept: commande
      binding: {commande_id: commande_id, entite: entite}
    - id: n02
      type: filter
      label: Factures validées
      inputs: [n01]
      condition: statut:equals:validée
      nulls: drop
    - id: n03
      type: compute
      label: déduction des taxes
      note: Chaque pays remplace ce calcul par sa propre formule, sans table de paramètres.
      inputs: [n02]
      column: montant_ht
      expr: montant_ttc - montant_taxes - avoirs
      column_type: decimal
    - id: n06
      type: source
      label: Jours comptables
      platform: databricks
      table: gold.finance.dim_date
      owner: claire.m
      columns:
        - {name: date_jour, type: date, timezone: Europe/Paris, format: yyyy-MM-dd}
        - {name: date_comptable, type: date, timezone: Europe/Paris, format: yyyy-MM-dd}
      concept: date-de-reference
    - id: n07
      type: join
      label: Date comptable de la facture
      inputs: {left: n03, right: n06}
      how: inner
      keys: [[date_facture, date_jour]]
      cardinality: N:1
      check: required
    - id: n04
      type: temporal
      label: Mois fiscal
      inputs: [n07]
      operation: period
      column: date_comptable
      target: mois_fiscal
      grain: month
    - id: n05
      type: aggregate
      inputs: [n04]
      group_by: [mois_fiscal, entite]
      measures: [[montant_ht, revenu_net, sum]]
  output: n05
scopes:
  - id: fy2026-mois-entite
    period: {from: 2026-02-01, to: 2026-09-30}
    granularity: [mois_fiscal, entite]
  - id: fy2026-t4
    period: {calendar_period: FY2026_Q4}
    granularity: [mois_fiscal, entite]
tolerance: {percent: 1.5}

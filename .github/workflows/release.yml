# Build release de Skifer Atlas (plan 0019, ADR 0023) : sidecar PyInstaller, tests du
# binaire, installateur Tauri signé, rapport de taille, test de fumée de l'app.
#
# Signature : uniquement par les secrets du dépôt, jamais dans le code. Sans secret (PR,
# fork), l'installateur est construit non signé avec un avertissement ; sur un tag `v*`,
# l'absence de signature fait échouer le job.
#   macOS   : APPLE_CERTIFICATE (p12 en base64), APPLE_CERTIFICATE_PASSWORD,
#             APPLE_SIGNING_IDENTITY, et pour la notarisation APPLE_ID, APPLE_PASSWORD
#             (mot de passe d'application), APPLE_TEAM_ID.
#   Windows : WINDOWS_CERTIFICATE (pfx en base64), WINDOWS_CERTIFICATE_PASSWORD.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "core/**"
      - "app/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    defaults:
      run:
        shell: bash
    env:
      SIGNED: ${{ (startsWith(matrix.runner, 'macos') && secrets.APPLE_CERTIFICATE != '') || (startsWith(matrix.runner, 'windows') && secrets.WINDOWS_CERTIFICATE != '') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Version unique (critère 6)
        run: |
          version="$(python scripts/version.py)"
          echo "Version : $version"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Le tag ${GITHUB_REF#refs/tags/} ne correspond pas à la version $version"
            exit 1
          fi

      - name: Sidecar PyInstaller
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
          bash scripts/build-sidecar.sh

      - name: Tests du binaire (critères 2, 3 et 4)
        working-directory: core
        run: uv run pytest -m sidecar tests/test_sidecar.py -v

      - name: Dépendances de l'app
        working-directory: app
        run: npm ci

      - name: Certificat Windows
        if: runner.os == 'Windows' && env.SIGNED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "atlas.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "WINDOWS_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Installateur Tauri (critère 1)
        working-directory: app
        env:
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Une variable vide ferait tenter à Tauri une signature sans certificat : on
          # n'exporte que celles qui ont une valeur.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            secret="SECRET_$name"
            if [ -n "${!secret}" ]; then export "$name=${!secret}"; fi
          done
          extra=()
          if [ -n "${WINDOWS_THUMBPRINT:-}" ]; then
            extra=(--config "{\"bundle\":{\"windows\":{\"certificateThumbprint\":\"$WINDOWS_THUMBPRINT\"}}}")
          fi
          npx tauri build --config src-tauri/tauri.release.conf.json "${extra[@]}" \
            --bundles ${{ matrix.bundles }}

      - name: Taille (critère 5)
        run: python scripts/size-report.py

      - name: Test de fumée de l'app (critère 3)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: bash scripts/smoke-app.sh "app/src-tauri/target/release/bundle/macos/Skifer Atlas.app"

      - name: Signature et notarisation
        run: |
          if [ "$SIGNED" != "true" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Release sans certificat : installateur non signé"
              exit 1
            fi
            echo "::warning::Pas de certificat (PR ou fork) : installateur non signé"
            exit 0
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            app="app/src-tauri/target/release/bundle/macos/Skifer Atlas.app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose "$app"
            for dmg in app/src-tauri/target/release/bundle/dmg/*.dmg; do
              xcrun stapler validate "$dmg" || xcrun stapler validate "$app"
            done
          else
            pwsh -Command '
              $failed = $false
              Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
                $signature = Get-AuthenticodeSignature $_.FullName
                Write-Host "$($_.Name) : $($signature.Status)"
                if ($signature.Status -ne "Valid") { $failed = $true }
              }
              if ($failed) { exit 1 }'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: skifer-atlas-${{ matrix.target }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

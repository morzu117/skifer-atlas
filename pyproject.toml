[project]
name = "skifer-atlas"
version = "0.0.1"
description = "Skifer Atlas — définitions canoniques et déclinaisons des KPI, comparaison structurelle et chiffrée."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "sqlglot>=25.0",
    "duckdb>=1.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skifer_atlas"]

[tool.ruff]
line-length = 100
target-version = "py311"
